<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aspen — Splat + Physics</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #0a0a0a;
        color: #eee;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      canvas { display: block; }
      #hud {
        position: fixed;
        top: 12px;
        left: 12px;
        padding: 10px 14px;
        background: rgba(0, 0, 0, 0.55);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 8px;
        font-size: 12px;
        line-height: 1.5;
        pointer-events: none;
        z-index: 10;
      }
      #hud b { color: #7cf; }
      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.75);
        z-index: 20;
        font-size: 14px;
      }
      #loading .card {
        padding: 20px 28px;
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 10px;
        min-width: 260px;
        text-align: center;
      }
      #loading .bar {
        margin-top: 10px;
        height: 6px;
        background: rgba(255,255,255,0.1);
        border-radius: 3px;
        overflow: hidden;
      }
      #loading .fill {
        height: 100%;
        width: 0%;
        background: #7cf;
        transition: width 0.15s ease;
      }
    </style>
  </head>
  <body>
    <div id="hud">
      <div><b>Mouse drag</b> — look around · <b>WASD</b> — move</div>
      <div><b>Space / Shift</b> — up / down · <b>F</b> — flip if upside-down</div>
      <div id="fps">fps: —</div>
    </div>
    <div id="loading">
      <div class="card">
        <div id="loading-text">Loading models…</div>
        <div class="bar"><div class="fill" id="loading-fill"></div></div>
      </div>
    </div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
